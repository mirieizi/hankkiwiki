server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # SPA 라우팅 처리
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 백엔드 API 프록시 설정
  location /api/ {
    proxy_pass         http://app:8081/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
  }
}
