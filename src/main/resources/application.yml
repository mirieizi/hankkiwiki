spring:

  datasource:
    url: jdbc:mysql://localhost:3306/hankkiwiki?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ssafy
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  mybatis:
    mapper-locations: classpath:/mappers/**/*.xml
    type-aliases-package: com.hankki.domain

  jpa:
    # ★ 반드시 Dialect를 지정해 줍니다
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

