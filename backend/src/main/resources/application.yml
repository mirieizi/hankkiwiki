spring:
  application:
    name: hankkiwiki

  datasource:
    url: jdbc:mysql://mysql:3306/${HANKKI_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${HANKKI_USERNAME}
    password: ${HANKKI_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      model: ${SPRING_AI_OPENAI_MODEL}

  mysql:
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./backend/mysql-init:/docker-entrypoint-initdb.d

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      model: ${SPRING_AI_OPENAI_MODEL}


mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.hankki.domain.diet.entity.DietMealItem
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.hankki: DEBUG
    org.mybatis: DEBUG
    jdbc.sqlonly: DEBUG
    org.springframework.context.annotation: DEBUG
    org.mybatis.spring.mapper: DEBUG
    com.hankki.common.security.filter.TokenAuthenticationFilter: DEBUG
    org.springframework.security: DEBUG

jwt:
  issuer: ${HANKKI_JWT_ISSURE}
  secret_key: ${HANKKI_JWT_SECRET_KEY}
  access-token-validity: ${HANKKI_JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${HANKKI_JWT_REFRESH_TOKEN_VALIDITY}

server:
  port: 8081
  servlet:
    context-path: /api # 중요: 이 설정으로 인해 모든 경로 앞에 /api가 붙습니다
    
