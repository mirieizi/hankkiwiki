spring:
  application:
    name: hankkiwiki

  datasource:
    url: jdbc:mysql://mysql:3306/${HANKKI_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${HANKKI_USERNAME}
    password: ${HANKKI_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379

      timeout: 10000ms # 타임아웃 설정 추가
      connect-timeout: 5000ms # 연결 타임아웃 추가
      lettuce:
        pool:
          max-active: 8 # 최대 연결 수
          max-idle: 8 # 최대 유휴 연결 수
          min-idle: 2 # 최소 유휴 연결 수
          max-wait: 5000ms # 연결 대기 시간

  mysql:
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./backend/mysql-init:/docker-entrypoint-initdb.d

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      model: ${SPRING_AI_OPENAI_MODEL}

# 벡터 관련 설정 추가
vector:
  redis:
    dimension: 9 # 벡터 차원
    search-timeout: 5000 # 검색 타임아웃 (ms)
    batch-size: 100 # 배치 크기
    index-prefix: "idx_" # 인덱스 접두사
    key-prefix: "food_" # 키 접두사

logging:
  level:
    com.hankki: DEBUG
    com.hankki.domain.vector: INFO
    jdbc.sqlonly: DEBUG
    org.springframework.context.annotation: DEBUG
    com.hankki.common.security.filter.TokenAuthenticationFilter: DEBUG
    org.springframework.security: DEBUG
    io.lettuce.core: WARN # Lettuce 로그 레벨 조정

jwt:
  issuer: ${HANKKI_JWT_ISSURE}
  secret_key: ${HANKKI_JWT_SECRET_KEY}
  access-token-validity: ${HANKKI_JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${HANKKI_JWT_REFRESH_TOKEN_VALIDITY}

server:
  port: 8081
  servlet:
    context-path: /api # 중요: 이 설정으로 인해 모든 경로 앞에 /api가 붙습니다

openai:
  secret-key: ${SPRING_AI_OPENAI_API_KEY}
  model: ${SPRING_AI_OPENAI_MODEL}
