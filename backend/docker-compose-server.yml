services:
  mysql:
    image: mysql:8.0.33
    restart: always
    container_name: mysql-1
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${HANKKI_ROOT_PASSWORD}
      MYSQL_DATABASE: ${HANKKI_DATABASE}
      MYSQL_USER: ${HANKKI_USERNAME}
      MYSQL_PASSWORD: ${HANKKI_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=500
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=256M
      --bulk_insert_buffer_size=64M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-1
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HANKKI_USERNAME: ${HANKKI_USERNAME}
      HANKKI_PASSWORD: ${HANKKI_PASSWORD}
      HANKKI_DATABASE: ${HANKKI_DATABASE}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL}
      HANKKI_JWT_ISSURE: ${HANKKI_JWT_ISSURE}
      HANKKI_JWT_SECRET_KEY: ${HANKKI_JWT_SECRET_KEY}
      HANKKI_JWT_ACCESS_TOKEN_VALIDITY: ${HANKKI_JWT_ACCESS_TOKEN_VALIDITY}
      HANKKI_JWT_REFRESH_TOKEN_VALIDITY: ${HANKKI_JWT_REFRESH_TOKEN_VALIDITY}
      DATA_SYNC_ENABLED: true
      DATA_SYNC_USE_FULL_DATA: true
      DATA_SYNC_BATCH_SIZE: 1000
    networks:
      - app-network
    volumes:
      - ~/.m2:/root/.m2

  redis:
    image: redis/redis-stack-server:7.2.0-v6
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-stack-server
      --save 900 1
      --save 300 10 
      --save 60 10000
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --timeout 0
      --tcp-keepalive 300
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_ARGS=--save 900 1 --save 300 10
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend
    container_name: frontend-1
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:

volumes:
  redis-data:
    driver: local
    name: hankki_redis_data